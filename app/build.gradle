plugins {
    id 'com.android.application'
}

android {
    namespace 'com.egaa.webtoapk'
    compileSdk 34

    defaultConfig {
        applicationId project.property("APP_ID")
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName project.findProperty("APP_VERSION_NAME") ?: "1.0"
        resValue "string", "app_name", project.property("APP_NAME")
        resValue "string", "start_url", project.property("APP_URL")
        resValue "color", "splash_bg", (project.findProperty("APP_SPLASH_COLOR") ?: "#FFE500")
        resValue "bool", "fullscreen_mode", (project.findProperty("APP_FULLSCREEN") ?: "false")
        resValue "bool", "native_permissions", (project.findProperty("APP_PERMISSIONS") ?: "false")
        manifestPlaceholders = [
            screenOrientation: (project.findProperty("APP_ORIENTATION") ?: "unspecified")
        ]
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
