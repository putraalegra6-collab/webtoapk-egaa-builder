name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Build identifier
        required: true
      app_name:
        description: Application name
        required: true
      package_name:
        description: Android package name
        required: true
      website_url:
        description: Website URL to wrap
        required: true
      icon_url:
        description: Public URL of the app icon
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validating website URL
        run: |
          set -e
          URL="${{ github.event.inputs.website_url }}"
          PKG="${{ github.event.inputs.package_name }}"
          echo "$URL" | grep -Eq '^https?://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+$' || { echo "Invalid website URL"; exit 1; }
          echo "$PKG" | grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$' || { echo "Invalid package name"; exit 1; }

      - name: Preparing project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparing app icon
        run: |
          set -e
          command -v convert >/dev/null 2>&1 || sudo apt-get install -y imagemagick
          mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi
          ICON_URL="${{ github.event.inputs.icon_url }}"
          if [ -n "$ICON_URL" ]; then
            curl -fsSL --max-filesize 3000000 "$ICON_URL" -o /tmp/icon.src
          else
            convert -size 512x512 xc:'#FFE500' -gravity center -pointsize 220 -fill '#111111' -annotate 0 'E' /tmp/icon.src
          fi
          for entry in "192 xxxhdpi" "96 xhdpi" "72 hdpi" "48 mdpi"; do
            set -- $entry
            convert /tmp/icon.src -resize "$1x$1^" -gravity center -extent "$1x$1" "app/src/main/res/mipmap-$2/ic_launcher.png"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Building Android application
        run: |
          gradle :app:assembleRelease --no-daemon \
            -PAPP_ID="${{ github.event.inputs.package_name }}" \
            -PAPP_NAME="${{ github.event.inputs.app_name }}" \
            -PAPP_URL="${{ github.event.inputs.website_url }}"

      - name: Signing APK
        run: |
          set -e
          BT=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          echo "Using build-tools $BT"
          keytool -genkeypair -v -keystore /tmp/release.jks -alias egaa \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass egaa12345 -keypass egaa12345 \
            -dname "CN=WebToApk Egaa, OU=Egaa, O=Egaa, L=Jakarta, S=Jakarta, C=ID"
          UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 "$UNSIGNED" /tmp/aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks /tmp/release.jks \
            --ks-pass pass:egaa12345 --key-pass pass:egaa12345 --ks-key-alias egaa \
            --out /tmp/app.apk /tmp/aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify /tmp/app.apk
          mkdir -p dist
          cp /tmp/app.apk "dist/${{ github.event.inputs.package_name }}.apk"

      - name: APK Ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release create "build-${{ github.event.inputs.build_id }}" \
            "dist/${{ github.event.inputs.package_name }}.apk" \
            --title "Build ${{ github.event.inputs.build_id }}" \
            --notes "APK generated by WebToApk Egaa."
