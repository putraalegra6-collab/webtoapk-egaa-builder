name: Build APK
run-name: Build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Build identifier
        required: true
      app_name:
        description: Application name
        required: true
      package_name:
        description: Android package name
        required: true
      website_url:
        description: Website URL to wrap
        required: true
      icon_url:
        description: Public URL of the app icon
        required: false
        default: ""
      splash_color:
        description: Splash screen background color (#RRGGBB)
        required: false
        default: "#FFE500"
      splash_video_url:
        description: Public URL of an MP4 splash video
        required: false
        default: ""
      orientation:
        description: Screen orientation (unspecified, portrait, landscape)
        required: false
        default: "unspecified"
      version_name:
        description: App version name
        required: false
        default: "1.0"
      build_format:
        description: Output format (apk, aab, both)
        required: false
        default: "apk"
      fullscreen:
        description: Hide the status bar (true/false)
        required: false
        default: "false"
      permissions:
        description: Enable camera, location and file upload permissions (true/false)
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.build_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validating website URL
        run: |
          set -e
          URL="${{ github.event.inputs.website_url }}"
          PKG="${{ github.event.inputs.package_name }}"
          COLOR="${{ github.event.inputs.splash_color }}"
          ORIENT="${{ github.event.inputs.orientation }}"
          VER="${{ github.event.inputs.version_name }}"
          FORMAT="${{ github.event.inputs.build_format }}"
          FULLSCREEN="${{ github.event.inputs.fullscreen }}"
          PERMS="${{ github.event.inputs.permissions }}"
          echo "$URL" | grep -Eq '^https?://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+$' || { echo "Invalid website URL"; exit 1; }
          echo "$PKG" | grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$' || { echo "Invalid package name"; exit 1; }
          echo "$COLOR" | grep -Eq '^#[0-9A-Fa-f]{6}$' || { echo "Invalid splash color"; exit 1; }
          echo "$ORIENT" | grep -Eq '^(unspecified|portrait|landscape)$' || { echo "Invalid orientation"; exit 1; }
          echo "$VER" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$' || { echo "Invalid version name"; exit 1; }
          echo "$FORMAT" | grep -Eq '^(apk|aab|both)$' || { echo "Invalid build format"; exit 1; }
          echo "$FULLSCREEN" | grep -Eq '^(true|false)$' || { echo "Invalid fullscreen flag"; exit 1; }
          echo "$PERMS" | grep -Eq '^(true|false)$' || { echo "Invalid permissions flag"; exit 1; }

      - name: Preparing project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparing app icon
        run: |
          set -e
          command -v convert >/dev/null 2>&1 || sudo apt-get install -y imagemagick
          mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi
          ICON_URL="${{ github.event.inputs.icon_url }}"
          if [ -n "$ICON_URL" ]; then
            curl -fsSL --max-filesize 3000000 "$ICON_URL" -o /tmp/icon.src
          else
            convert -size 512x512 xc:'#FFE500' -gravity center -pointsize 220 -fill '#111111' -annotate 0 'E' PNG:/tmp/icon.src
          fi
          for entry in "192 xxxhdpi" "96 xhdpi" "72 hdpi" "48 mdpi"; do
            set -- $entry
            convert /tmp/icon.src -resize "$1x$1^" -gravity center -extent "$1x$1" "app/src/main/res/mipmap-$2/ic_launcher.png"
          done
          convert /tmp/icon.src -resize 288x288 -gravity center -extent 288x288 app/src/main/res/drawable/splash_logo.png

      - name: Preparing splash video and app options
        run: |
          set -e
          VIDEO_URL="${{ github.event.inputs.splash_video_url }}"
          if [ -n "$VIDEO_URL" ]; then
            mkdir -p app/src/main/res/raw
            curl -fsSL --max-filesize 12000000 "$VIDEO_URL" -o app/src/main/res/raw/splash_video.mp4
            SIZE=$(stat -c %s app/src/main/res/raw/splash_video.mp4)
            if [ "$SIZE" -gt 12000000 ]; then echo "Splash video is too large"; exit 1; fi
            file app/src/main/res/raw/splash_video.mp4 | grep -qi 'mp4\|ISO Media' || { echo "Splash video must be an MP4 file"; exit 1; }
            echo "Splash video ready ($SIZE bytes)"
          fi
          if [ "${{ github.event.inputs.permissions }}" != "true" ]; then
            sed -i '/OPTIONAL_PERMISSIONS_START/,/OPTIONAL_PERMISSIONS_END/d' app/src/main/AndroidManifest.xml
            echo "Optional permissions removed"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Building Android application
        run: |
          set -e
          FORMAT="${{ github.event.inputs.build_format }}"
          TASKS=":app:assembleRelease"
          if [ "$FORMAT" = "aab" ]; then TASKS=":app:bundleRelease"; fi
          if [ "$FORMAT" = "both" ]; then TASKS=":app:assembleRelease :app:bundleRelease"; fi
          gradle $TASKS --no-daemon --parallel --build-cache \
            -PAPP_ID="${{ github.event.inputs.package_name }}" \
            -PAPP_NAME="${{ github.event.inputs.app_name }}" \
            -PAPP_URL="${{ github.event.inputs.website_url }}" \
            -PAPP_SPLASH_COLOR="${{ github.event.inputs.splash_color }}" \
            -PAPP_ORIENTATION="${{ github.event.inputs.orientation }}" \
            -PAPP_VERSION_NAME="${{ github.event.inputs.version_name }}" \
            -PAPP_FULLSCREEN="${{ github.event.inputs.fullscreen }}" \
            -PAPP_PERMISSIONS="${{ github.event.inputs.permissions }}"

      - name: Signing APK
        run: |
          set -e
          BT=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          echo "Using build-tools $BT"
          keytool -genkeypair -v -keystore /tmp/release.jks -alias egaa \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass egaa12345 -keypass egaa12345 \
            -dname "CN=WebToApk Egaa, OU=Egaa, O=Egaa, L=Jakarta, S=Jakarta, C=ID"
          mkdir -p dist
          FORMAT="${{ github.event.inputs.build_format }}"
          if [ "$FORMAT" = "apk" ] || [ "$FORMAT" = "both" ]; then
            UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
            "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 "$UNSIGNED" /tmp/aligned.apk
            "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks /tmp/release.jks \
              --ks-pass pass:egaa12345 --key-pass pass:egaa12345 --ks-key-alias egaa \
              --out /tmp/app.apk /tmp/aligned.apk
            "$ANDROID_HOME/build-tools/$BT/apksigner" verify /tmp/app.apk
            cp /tmp/app.apk "dist/${{ github.event.inputs.package_name }}.apk"
          fi
          if [ "$FORMAT" = "aab" ] || [ "$FORMAT" = "both" ]; then
            BUNDLE=$(find app/build/outputs/bundle/release -name '*.aab' | head -n 1)
            cp "$BUNDLE" /tmp/app.aab
            jarsigner -keystore /tmp/release.jks -storepass egaa12345 -keypass egaa12345 \
              -sigalg SHA256withRSA -digestalg SHA-256 /tmp/app.aab egaa
            jarsigner -verify /tmp/app.aab
            cp /tmp/app.aab "dist/${{ github.event.inputs.package_name }}.aab"
          fi
          ls -l dist

      - name: APK Ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release create "build-${{ github.event.inputs.build_id }}" \
            dist/* \
            --title "Build ${{ github.event.inputs.build_id }}" \
            --notes "Android build generated by WebToApk Egaa."
